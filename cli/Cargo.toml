[package]
name = "yurine-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "yurine"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yurine = { path = ".." }
