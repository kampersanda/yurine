[workspace]
members = ["benchmarks", "cli"]
default-members = [".", "cli"]
resolver = "3"

[package]
name = "yurine"
version = "0.1.0"
edition = "2024"

[features]
default = []
persist = ["dep:memmap2", "dep:tempfile", "dep:zerocopy"]

[dependencies]
memmap2 = { version = "0.9.11", optional = true }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.20"
zerocopy = { version = "0.8.54", features = ["derive"], optional = true }

[dev-dependencies]
approx = "0.5.1"
rstest = { version = "0.26.1", default-features = false }
tempfile = "3.27.0"
