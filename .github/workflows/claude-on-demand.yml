name: Claude on demand

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # issue_comment はIssue・PRの両方に発火するため、どちらでも @claude を利用できる。
    # 公開リポジトリ上の第三者がClaudeを起動できないよう、所有者のコメントだけを受け付ける。
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == 'kampersanda'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # claude-code-action checks out the PR head; retain the base history
          # so three-dot diffs can resolve their merge base.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --max-turns 40
            --allowedTools "Bash(git:*)"
            --append-system-prompt "コード変更、build、testは行わず、レビュー・説明・提案だけをしてください。PRでは最初にgit diffで変更範囲を把握し、変更されたコードとその直接の依存先だけを調べてください。CI結果と既存テストを証拠として使い、実害のある指摘を優先してください。調査を広げる前に、必ず依頼への結論をコメントしてください。"
